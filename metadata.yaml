name: list_reminder
desc: 智能列表式任务管理插件 - 支持定时任务、任务/用户标签、按标签群发，可通过AI对话或后台管理系统创建
help: 功能包含：
  1. AI对话创建任务：发送"提醒我明天下午3点开会"等关键词触发
  2. 支持显式标签：例如「提醒我情人节买礼物，标签：节日」
  3. 支持按用户标签群发：例如「给所有二处的人下达任务，明天9点提交周报」
  4. /列表提醒 列表 - 列出所有待办任务（含标签）
  5. /列表提醒 清空 - 清空所有任务
  6. /列表提醒 后台 - 开启个人后台（仅看自己任务）
  7. /列表提醒 关闭后台 - 立即失效登录密钥
  8. /列表提醒 管理员后台 - 管理员可查看/管理所有任务（需配置 admin_sender_ids）
  9. 后台支持任务关键字搜索
version: v1.3.0
author: LinearBall
repo: https://github.com/LinearBall/astrbot_plugin_list_reminder